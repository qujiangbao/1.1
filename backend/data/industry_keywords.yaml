# ── 兜底分类 ────────────────────────────────────────────────────────────────

fallback:
  label: "其他"
  display_name: "其他产业"
  description: "不归属于八大重点产业的企业，设为'其他'"
  confidence: 0.3
  triggers:
    - "所有流水线均未命中任何产业关键词"

# ── 歧义消解规则 ──────────────────────────────────────────────────────────

disambiguation:

  # 名称歧义 — 需要二次判断
  name_ambiguities:
    - pattern: "新能源"
      unless_contains: ["汽车", "车", "vehicle"]
      redirect_to: null          # null = 不归入新能源汽车，由其他规则判断
      note: "新能源科技公司如无明确'汽车'关键词，不自动归类为新能源汽车"

    - pattern: "智能科技"
      default_primary: "人工智能"
      default_secondary: null
      note: "'XX智能科技有限公司'默认归为人工智能，除非经营范围明确指向其他产业"

    - pattern: "自动化"
      default_primary: "智能制造"
      default_secondary: "机器人"
      note: "通用自动化公司归为智能制造（主）+ 机器人（次）"

  # 交叉产业优先级
  cross_priority:
    description: "当一个企业名称同时命中多个产业时，按此优先级选 primary"
    order:
      - "semiconductor"           # 半导体最特化
      - "integrated_circuit"      # 集成电路也很特化
      - "biomedicine"             # 生物医药边界清晰
      - "new_energy_vehicle"      # 新能源汽车边界清晰
      - "robotics"                # 机器人边界较清晰
      - "artificial_intelligence" # AI 外延较广
      - "smart_manufacturing"     # 智能制造外延广
      - "digital_economy"         # 数字经济外延最广
