# =============================================================================
# industry_keywords.yaml — 广州产业招商企业分类关键词体系
# =============================================================================
# 用途：
#   1. 根据企业名称、经营范围、产品描述自动归类到八大重点产业
#   2. EnterpriseDataTool 在 mock/real 模式下对搜索结果做行业标签
#   3. 前端产业筛选与统计的标签依据
#
# 分类方法（多级流水线，任一命中即停止）：
#   1. name_match    — 企业名称中包含关键词 → 直接归类，confidence=0.95
#   2. scope_match   — 经营范围中包含关键词 → 归类，confidence=0.85
#   3. product_match — 核心产品/技术中包含关键词 → 归类，confidence=0.75
#   4. fallback      — 以上均不命中 → industry="其他", confidence=0.3
#
# 一家企业最多归属 2 个产业（primary + secondary）。
# =============================================================================

version: "1.0"
description: "广州市重点产业企业分类关键词体系"
date: "2026-07-26"
source: "GB/T 4754-2017 + 广州市八大重点产业规划"

# ── 分类规则 ────────────────────────────────────────────────────────────────

classification_rules:

  max_labels_per_enterprise: 2
  min_confidence: 0.5

  pipeline:
    - stage: "name_match"
      description: "企业名称中包含目标关键词 → 直接归类"
      confidence: 0.95
      fields: ["name"]

    - stage: "scope_match"
      description: "经营范围中包含目标关键词 → 归类"
      confidence: 0.85
      fields: ["business_scope", "industry"]

    - stage: "product_match"
      description: "核心产品/技术中包含目标关键词 → 归类"
      confidence: 0.75
      fields: ["products", "technologies", "description"]

