# ── 查询结果门控 ────────────────────────────────────────────────────────────

result_gating:
  description: "搜索结果的质量和来源门控"

  quality_checks:
    # 每条结果至少满足一个质量条件
    - check: "has_credit_code"
      description: "有统一社会信用代码"
      required: true

    - check: "has_registered_capital"
      description: "有注册资本数据"
      required: false

    - check: "has_industry_classification"
      description: "有行业分类（GB/T 4754）"
      required: false

  # 来源标记
  source_tags:
    tianyancha: "天眼查"
    qichacha: "企查查"
    government: "国家企业信用信息公示系统"
    manual: "人工录入"

  # 数据新鲜度
  freshness:
    max_age_days: 90
    warn_age_days: 60
    description: "超过 90 天未更新的企业数据应标记为 stale"

# ── 搜索执行配置 ────────────────────────────────────────────────────────────

execution:
  description: "批量搜索执行的调度配置"

  rate_limits:
    tianyancha:
      max_requests_per_minute: 30
      max_concurrent: 3
    qichacha:
      max_requests_per_minute: 20
      max_concurrent: 2
    government:
      max_requests_per_minute: 10
      max_concurrent: 1

  batch:
    description: "全量批量搜索的调度"
    industries_per_batch: 2
    pause_between_batches_seconds: 60
    max_runtime_minutes: 30

  dedup:
    description: "跨查询结果的去重规则"
    key_fields: ["credit_code", "name", "legal_representative"]
    method: "credit_code 优先 → 名称模糊匹配 → 法人精确匹配"
