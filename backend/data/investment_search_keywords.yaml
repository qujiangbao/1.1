  # ═══ 4. 新能源汽车 ═══
  new_energy_vehicle:
    display_name: "新能源汽车"
    strategy:
      description: "整车/三电优先 → 智能网联 → 充电基础设施"
      layers:
        - name: "三电层"
          description: "电池/电机/电控 核心供应商"
        - name: "智联层"
          description: "智能座舱/自动驾驶/车联网"
        - name: "设施层"
          description: "充电桩/换电站/电池回收"

    queries:
      # ── 三电层 ──
      - id: "nev-battery-1"
