# =============================================================================
# investment_search_keywords.yaml — 招商线索搜索关键词体系
# =============================================================================
# 用途：
#   1. ExternalDataSource（天眼查/企查查/政府平台）的企业搜索查询模板
#   2. 自动构建每个产业的"搜索组合"——产业词 + 地域词 + 规模词 + 阶段词
#   3. 每条搜索查询包含：关键词 AND/OR 组合、搜索范围、权重
#
# 搜索平台映射：
#   tianyancha  — 天眼查 (https://api.tianyancha.com)
#   qichacha    — 企查查 (https://openapi.qcc.com)
#   government  — 国家企业信用信息公示系统
#
# 约束：
#   - 不生成虚假企业
#   - 不预设招商漏斗数据
#   - 搜索结果需经 data_available 门控
# =============================================================================

version: "1.0"
description: "广州八大重点产业招商线索搜索关键词体系"
date: "2026-07-26"
target_region: "广州市及粤港澳大湾区"

# ── 通用搜索配置 ────────────────────────────────────────────────────────────

search_config:
  # 默认地域范围
  default_regions:
    primary:
      - "广州"
      - "广州市"
    secondary:
      - "深圳"
      - "佛山"
      - "东莞"
      - "珠海"
      - "中山"
      - "惠州"
    # 大湾区之外的补充
    extended:
      - "北京"
      - "上海"
      - "杭州"
      - "苏州"
      - "成都"
      - "武汉"
      - "合肥"

  # 企业规模过滤 — 按注册资本
  capital_filters:
    large:    "注册资本 >= 1亿"      # 大型企业
    medium:   "5000万 <= 注册资本 < 1亿"  # 中型企业
    small:    "1000万 <= 注册资本 < 5000万"  # 成长型
    startup:  "注册资本 < 1000万"     # 初创

  # 企业阶段过滤
  stage_filters:
    growth:       "成立 3-10 年，有融资记录"
    mature:       "成立 10 年以上"
    early:        "成立 1-3 年"
    pre_revenue:  "有专利但未量产"

  # 搜索深度
  max_results_per_query: 20
  max_queries_per_industry: 10

# ── 产业搜索查询 ────────────────────────────────────────────────────────────

industries:

  # ═══ 1. 人工智能 ═══
  artificial_intelligence:
    display_name: "人工智能"
    # 搜索策略：AI 企业往往注册名中有"智能"/"科技"，需多轮搜索
    strategy:
      description: "分三层搜索 — 核心技术企业 → 应用层企业 → 基础设施企业"
      layers:
        - name: "核心层"
          description: "大模型/算法/平台公司"
        - name: "应用层"
          description: "AI+行业解决方案公司"
        - name: "基础设施层"
          description: "算力/数据/AI芯片公司"

    queries:
      # ── 核心层 ──
      - id: "ai-core-1"
        text: "人工智能 大模型"
        region_filter: "primary"
        capital_filter: "medium"
        stage_filter: "growth"
        platform_hint: "tianyancha"
        weight: 10

      - id: "ai-core-2"
        text: "计算机视觉 OR 机器视觉 OR 图像识别"
        region_filter: "primary_secondary"
        capital_filter: "small"
        stage_filter: "growth"
        platform_hint: "any"
        weight: 9

      - id: "ai-core-3"
        text: "自然语言处理 OR 语音识别 OR NLP"
        region_filter: "primary"
        capital_filter: "small"
        stage_filter: "any"
        platform_hint: "any"
        weight: 8

      - id: "ai-core-4"
        text: "AI芯片 OR 智能芯片 OR 人工智能芯片 OR NPU OR 神经网络处理器"
        region_filter: "all"
        capital_filter: "medium"
        stage_filter: "growth"
        platform_hint: "any"
        weight: 9

      # ── 应用层 ──
      - id: "ai-app-1"
        text: "智能驾驶 OR 自动驾驶 OR ADAS"
        region_filter: "primary_secondary"
        capital_filter: "small"
        stage_filter: "growth"
        platform_hint: "any"
        weight: 8
        note: "与新能源汽车交叉"

      - id: "ai-app-2"
        text: "智能制造 机器视觉 OR 智能检测 OR AI质检"
        region_filter: "primary_secondary"
        capital_filter: "small"
        stage_filter: "any"
        platform_hint: "any"
        weight: 7

      - id: "ai-app-3"
        text: "医疗AI OR AI医疗 OR 智能诊断 OR AI制药"
        region_filter: "all"
        capital_filter: "small"
        stage_filter: "early"
        platform_hint: "any"
        weight: 7

      # ── 基础设施层 ──
      - id: "ai-infra-1"
        text: "算力服务 OR GPU算力 OR 智能计算中心"
        region_filter: "all"
        capital_filter: "large"
        stage_filter: "mature"
        platform_hint: "any"
        weight: 6

      - id: "ai-infra-2"
        text: "数据标注 OR 数据标注服务 OR 训练数据"
        region_filter: "primary_secondary"
        capital_filter: "small"
        stage_filter: "any"
        platform_hint: "any"
        weight: 5

  # ═══ 2. 机器人 ═══
  robotics:
    display_name: "机器人"
    strategy:
      description: "本体制造商优先 → 核心零部件 → 系统集成商"
      layers:
        - name: "本体层"
          description: "工业/服务/特种机器人整机制造商"
        - name: "零部件层"
          description: "减速器/伺服/控制器/传感器供应商"
        - name: "集成层"
          description: "机器人系统集成和解决方案商"

    queries:
      # ── 本体层 ──
      - id: "robot-body-1"
        text: "工业机器人 制造 OR 工业机器人 生产"
        region_filter: "primary_secondary"
        capital_filter: "medium"
        stage_filter: "growth"
        platform_hint: "any"
        weight: 10

      - id: "robot-body-2"
        text: "服务机器人 OR 配送机器人 OR 清洁机器人 OR 巡检机器人"
        region_filter: "primary_secondary"
        capital_filter: "small"
        stage_filter: "any"
        platform_hint: "any"
        weight: 9

      - id: "robot-body-3"
        text: "人形机器人 OR 双足机器人 OR 四足机器人"
        region_filter: "all"
        capital_filter: "medium"
        stage_filter: "early"
        platform_hint: "any"
        weight: 8

      - id: "robot-body-4"
        text: "协作机器人 OR 轻型机器人 OR 柔性机器人"
        region_filter: "primary_secondary"
        capital_filter: "small"
        stage_filter: "growth"
        platform_hint: "any"
        weight: 8

      # ── 零部件层 ──
      - id: "robot-part-1"
        text: "RV减速器 OR 谐波减速器 OR 机器人减速器"
        region_filter: "all"
        capital_filter: "small"
        stage_filter: "any"
        platform_hint: "any"
        weight: 9

      - id: "robot-part-2"
        text: "伺服电机 OR 伺服驱动器 OR 驱控一体"
        region_filter: "primary_secondary"
        capital_filter: "medium"
        stage_filter: "any"
        platform_hint: "any"
        weight: 8

      - id: "robot-part-3"
        text: "机器人控制器 OR 运动控制器 OR 运动控制卡"
        region_filter: "all"
        capital_filter: "small"
        stage_filter: "any"
        platform_hint: "any"
        weight: 8

      # ── 集成层 ──
      - id: "robot-integ-1"
