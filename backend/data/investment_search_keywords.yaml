        region_filter: "all"
        capital_filter: "medium"
        stage_filter: "growth"
        platform_hint: "any"
        weight: 8

      - id: "nev-smart-2"
        text: "激光雷达 OR 毫米波雷达 OR 车载传感器"
        region_filter: "all"
        capital_filter: "small"
        stage_filter: "growth"
        platform_hint: "any"
        weight: 8

      - id: "nev-smart-3"
        text: "智能座舱 OR 车载信息娱乐 OR 座舱域控制器"
        region_filter: "primary_secondary"
        capital_filter: "medium"
