# =============================================================================
# policy_keywords.yaml — 广州产业招商政策关键词分类体系
# =============================================================================
# 用途：
#   1. PolicyAgent 按产业对政策进行自动分类和标签
#   2. PolicyRetriever 在 crawl4ai/pgvector 模式下按产业过滤
#   3. 前端政策检索页面的产业筛选器数据源
#
# 匹配规则（按优先级）：
#   1. exact     — 精确匹配政策标题/文号中的关键词，confidence=1.0
#   2. directive — 匹配核心政策指令词，confidence=0.9
#   3. keyword   — 匹配正文中的扩展关键词，confidence=0.7-0.85
#   4. context   — 上下文相关词（可能跨行业），confidence=0.5
#
# 每条政策的 industry_tags 取 confidence 最高的前 3 个产业。
# 一条政策可以属于多个产业（如"智能制造"+"机器人"交叉）。
# =============================================================================

version: "1.0"
