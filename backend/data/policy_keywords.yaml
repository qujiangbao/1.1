# ── 匹配规则定义 ────────────────────────────────────────────────────────────

matching_rules:
  description: "关键词匹配优先级与权重"

  tiers:
    - name: "exact"
      description: "精确匹配 — 关键词出现在政策标题或文号中"
      confidence_base: 1.0
      boost: 0.15
    - name: "directive"
      description: "核心指令词 — 政策正文中出现的行业核心术语"
      confidence_base: 0.9
      boost: 0.10
    - name: "keyword"
      description: "扩展关键词 — 正文中的相关技术/产品词"
      confidence_base: 0.75
      boost: 0.05
    - name: "context"
      description: "上下文相关 — 可能跨行业的关键词"
      confidence_base: 0.5
      boost: 0.0

  fusion:
    description: "多关键词命中的融合策略"
    max_industry_tags: 3
    min_confidence: 0.5
    dedup_method: "max_confidence"  # 对同一产业取所有命中词的最高 confidence

# ── 跨产业关联 ──────────────────────────────────────────────────────────────

cross_industry_links:
  description: "两个产业共有关键词时的权重分配"

  pairs:
    - [semiconductor, integrated_circuit]
    - [robotics, smart_manufacturing]
    - [artificial_intelligence, digital_economy]
    - [new_energy_vehicle, smart_manufacturing]
    - [artificial_intelligence, robotics]

  co_occurrence_rules:
    # 当一条政策同时命中半导体和集成电路关键词时
    # 不视为错误，而是正常交叉分类
    allow_multiple: true
    # 共现对的 confidence 缩放
    damping_factor: 0.85  # 共现时每个产业的 confidence 乘以此系数
